name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: |
          chmod +x mvnw
          ./mvnw clean test

      - name: Validate backend package
        run: ./mvnw package -DskipTests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8081

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Audit high-severity frontend dependencies
        run: npm audit --audit-level=high

  e2e:
    name: E2E
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_API_URL: http://127.0.0.1:8081
      E2E_BASE_URL: http://127.0.0.1:3001

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated E2E environment
        run: npm run e2e:env:up

      - name: Wait for the E2E backend
        run: |
          for attempt in $(seq 1 45); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/api/auth/me || true)"
            if [ "$status" = "401" ]; then
              echo "E2E backend is ready."
              exit 0
            fi

            echo "Waiting for E2E backend (attempt $attempt/45; HTTP $status)..."
            sleep 2
          done

          echo "E2E backend did not become ready in time."
          docker compose -f ../docker-compose.e2e.yml logs --no-color
          exit 1

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Collect E2E service logs on failure
        if: failure()
        run: docker compose -f ../docker-compose.e2e.yml logs --no-color

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated E2E environment
        if: always()
        run: npm run e2e:env:down

  quality-gate:
    name: Quality Gate
    needs:
      - backend
      - frontend
      - e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required quality checks
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "Backend: ${{ needs.backend.result }}"
            echo "Frontend: ${{ needs.frontend.result }}"
            echo "E2E: ${{ needs.e2e.result }}"
            exit 1
          fi

          echo "All required quality checks passed."
