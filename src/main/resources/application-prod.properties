spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production is intentionally fail-safe: Flyway applies the versioned migrations
# and Hibernate validates the resulting schema instead of creating or updating it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.session.cookie-name=pm_session
app.session.secure=true
app.session.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
app.bootstrap.admin.name=${ADMIN_NAME:}
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}

# Production does not expose the administrative API documentation by default.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=INFO
logging.level.com.brayanfavarin.professionalmanagement=INFO
