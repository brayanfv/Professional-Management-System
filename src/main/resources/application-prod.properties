spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production is intentionally fail-safe: schema validation and Flyway require
# the approved baseline migration that will be added in the database phase.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.bootstrap.admin.name=${ADMIN_NAME:}
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}

# Production does not expose the administrative API documentation by default.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
