spring.datasource.url=jdbc:h2:mem:professional_management_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# The test profile uses an isolated in-memory database and does not run Flyway.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-only-jwt-secret-with-at-least-32-characters
app.jwt.expiration=3600
app.cors.allowed-origins=http://localhost:3000
app.session.cookie-name=pm_session
app.session.secure=false
app.session.same-site=Lax
app.security.login-rate-limit.capacity=100
app.security.login-rate-limit.refill-tokens=100
app.security.login-rate-limit.refill-period=1m

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.level.root=INFO
logging.level.com.brayanfavarin.professionalmanagement=INFO
