spring.application.name=professional-management-system
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}

# Authentication payload DTOs redact secrets in their string representation.
# These targeted levels also prevent Spring MVC body-converter DEBUG messages
# from serializing request/response objects into logs when generic DEBUG is set.
spring.mvc.log-request-details=false
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO
spring.jpa.open-in-view=false
