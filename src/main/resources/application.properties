spring.application.name=professional-management-system
# A profile must be selected explicitly. This prevents a production deployment
# from silently inheriting local-development security defaults.
spring.profiles.default=none
server.port=${SERVER_PORT:8080}

# Authentication payload DTOs redact secrets in their string representation.
# These targeted levels also prevent Spring MVC body-converter DEBUG messages
# from serializing request/response objects into logs when generic DEBUG is set.
spring.mvc.log-request-details=false
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO
spring.jpa.open-in-view=false

# Only health probes are exposed over HTTP. Liveness remains process-focused,
# while readiness also verifies that the configured database is reachable.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# The in-memory login limiter is intentionally scoped to a single application
# instance. Deployment environments can tune these values without code changes.
app.security.login-rate-limit.capacity=${LOGIN_RATE_LIMIT_CAPACITY:10}
app.security.login-rate-limit.refill-tokens=${LOGIN_RATE_LIMIT_REFILL_TOKENS:10}
app.security.login-rate-limit.refill-period=${LOGIN_RATE_LIMIT_REFILL_PERIOD:1m}
app.security.trusted-proxy.enabled=${TRUSTED_PROXY_ENABLED:false}
app.security.trusted-proxy.addresses=${TRUSTED_PROXY_ADDRESSES:}
