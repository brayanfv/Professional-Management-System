# PostgreSQL integration tests use a disposable Testcontainers database.
# @ServiceConnection supplies the datasource; no local or compose database is used.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=integration-test-jwt-secret-with-at-least-32-characters
app.jwt.expiration=3600
app.cors.allowed-origins=http://localhost:3000

# AdminBootstrap remains harmless in this dedicated profile because its required
# values are intentionally blank. Integration tests never create a real admin.
app.bootstrap.admin.name=
app.bootstrap.admin.email=
app.bootstrap.admin.password=

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.level.root=INFO
logging.level.com.brayanfavarin.professionalmanagement=INFO
