name: professional-management-e2e

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: professional_management_e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e-test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d professional_management_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: professional_management_e2e
      DB_USERNAME: e2e
      DB_PASSWORD: e2e-test-only-password
      SERVER_PORT: 8080
      JWT_SECRET: e2e-session-signing-key-not-for-any-environment-123456789
      JWT_EXPIRATION: 3600
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3001
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAME_SITE: Lax
      ADMIN_NAME: E2E Administrator
      ADMIN_EMAIL: ${E2E_ADMIN_EMAIL:-e2e-admin@example.test}
      ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-E2E-admin-only-ChangeMe1!}
    ports:
      - "127.0.0.1:8081:8080"
